<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World App</title>
  <style>
    :root {
      --accent: #2563eb;
      --bg: #f4f6fb;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e0eaff 0%, var(--bg) 100%);
    }
    .card {
      background: var(--card);
      padding: 3rem 4rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.12);
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      color: #111827;
      margin-bottom: 0.5rem;
    }
    p {
      color: #4b5563;
      margin-bottom: 1.5rem;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    button:hover { background: #1d4ed8; transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    #counter { font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World! 🌍</h1>
    <p>This is a simple web app built with HTML, CSS, and JavaScript.</p>
    <button id="greet-btn">Click me</button>
    <p style="margin-top: 1.25rem; margin-bottom: 0;">
      Clicks: <span id="counter">0</span>
    </p>
  </div>

  <script>
    const button = document.getElementById("greet-btn");
    const counter = document.getElementById("counter");
    let clicks = 0;

    button.addEventListener("click", () => {
      clicks += 1;
      counter.textContent = clicks;
    });
  </script>
</body>
</html>
